syntax = "proto3";

package dhamma;

// 그대로 네임스페이스가 됨
// namespace Dhamma.Contracts.Ai (그대로 네임스페이스가 됨)
option csharp_namespace = "Dhamma.Contracts.Ai";

// ChatService (static 외곽 클래스, 서비스 이름 그대로)
// ChatService.ChatServiceBase, {서비스명}Base, (서버용 추상 클래스)
// ChatService.ChatServiceClient, {서비스명}Client (클라이언트용)
service ChatService {
  // Ask / AskAsync, 메서드명 그대로 (+클라이언트는 Async 로 붙음)
  rpc Ask(AskRequest) returns (stream AskResponse);
}

message ChatMessage {
  string role = 1; // "user" | "assistant"
  string content = 2;
}

// class AskRequest, 메시지 이름 그대로
message AskRequest {
  // string Question
  // snake_case -> PascalCase
  string question = 1; // 지금 질문

  // RepeatedField<ChatMessage> History
  // repeated -. RepeatedField<T>
  repeated ChatMessage history = 2; // 이전 대화 (오래된것 -> 최신 순)
}

message AskResponse {
  string text = 1;

  // bool IsThinking
  // is_think -> IsThinking
  bool is_thinking = 2; // true면 사고 과정 토큰
}

